project:
  name: EdgeNAS-Lite
  description: LLM-guided hardware-aware YOLO optimization system
  task: object_detection

dataset:
  name: KITTI
  selected_classes:
    - car
    - pedestrian
    - cyclist

baseline:
  model: yolo26n.pt
  image_size: 640
  epochs: 10
  batch_size: 8

target_hardware:
  device: local_cpu

constraints:
  max_latency_ms: 50
  max_model_size_mb: 15
  priority: balanced

evaluation:
  metrics:
    - map50
    - map50_95
    - latency_ms
    - fps
    - model_size_mb
    - parameters_m